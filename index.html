<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cIRCo.chat</title>
<meta name="description" content="Colorful chat rooms for cities, interests and spontaneous conversations. Every room is a different show.">
<meta name="theme-color" content="#120E1A">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23120E1A'/%3E%3Cpath d='M37.9 24.1A14 14 0 1 0 37.9 43.9' fill='none' stroke='%23F0483E' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='45' cy='19' r='4.5' fill='none' stroke='%23FFD447' stroke-width='3.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400&family=Rye&display=swap">
<style>
/* cIRCo.chat — the marquee outside, plain IRC inside.
   Rye only sets Latin strings (logo, #room names). Anonymous Pro carries everything else, Cyrillic included. */
:root{
  --night:#120E1A; --night-2:#1A1424; --night-3:#251D33; --line:#2F2640;
  --paper:#F4E8CF; --muted:#A79BB4; --faint:#73678A;
  --bulb:#FFD27A; --bulb-off:#47382A;
  --red:#F0483E; --yellow:#FFD447;
  --join:#7BD88F; --action:#C792EA; --notice:#E9B44C; --bad:#FF8A7A;
  --display:"Rye","Rockwell Extra Bold","Rockwell",Georgia,serif;
  --mono:"Anonymous Pro","PT Mono","DejaVu Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--paper);font:400 17px/1.55 var(--mono);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
/* the big top at night: canvas stripes fanning out from the tent pole, barely there */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(130% 90% at 50% 0%,transparent 0 35%,var(--night) 78%),
    repeating-conic-gradient(from 0deg at 50% -40%,#18121F 0deg 3deg,var(--night) 3deg 6deg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bulb);outline-offset:3px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- lobby ---------- */
.lobby{max-width:1080px;margin:0 auto;padding:clamp(14px,3vw,28px) clamp(16px,4vw,32px) 56px}
.lang{display:flex;justify-content:flex-end;gap:2px}
.lang button{font-size:14px;color:var(--muted);background:none;border:1px solid transparent;border-radius:999px;padding:4px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--paper);border-color:var(--line)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:clamp(6px,2vw,18px)}

.sign{position:relative;max-width:100%;padding:clamp(34px,6vw,54px) clamp(34px,8vw,80px) clamp(28px,5vw,44px);border-radius:24px;
  background:radial-gradient(90% 120% at 50% 35%,#2B2034,#1B1423 72%);
  box-shadow:inset 0 0 0 1px #4A3A2A,inset 0 0 0 26px rgba(0,0,0,.18),0 50px 100px -40px #000}
.bulbs{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.bulbs rect{fill:none;stroke-linecap:round}
.bulbs .on{stroke:var(--bulb);stroke-width:6;animation:power 1.2s linear both}
.bulbs .off{stroke:var(--bulb-off);stroke-width:6.6}
@keyframes power{0%{opacity:0}10%{opacity:.85}16%{opacity:.15}30%{opacity:1}38%{opacity:.35}52%{opacity:1}100%{opacity:1}}

.logo{margin:0;font:400 clamp(66px,15vw,146px)/.92 var(--display);white-space:nowrap}
.logo span span{display:inline-block;animation:lamp .7s linear both;animation-delay:calc(.35s + var(--i) * .13s)}
.logo .lr{color:var(--red);text-shadow:0 0 26px rgba(240,72,62,.5),0 0 3px rgba(255,150,130,.8)}
.logo .ly{color:var(--yellow);text-shadow:0 0 26px rgba(255,212,71,.42),0 0 3px rgba(255,246,200,.9)}
@keyframes lamp{0%{opacity:.12;text-shadow:none}25%{opacity:.9}33%{opacity:.25}55%{opacity:1}64%{opacity:.6}100%{opacity:1}}
.tagline{margin:.75em 0 0;font-style:italic;font-size:clamp(17px,2.3vw,21px);line-height:1.35}

.intro{max-width:60ch;margin:30px auto 0;color:var(--muted)}
.nick{display:flex;align-items:center;gap:6px;margin:16px auto 0;padding:5px 8px 5px 18px;border:1px solid var(--line);border-radius:999px;background:var(--night-2)}
.nick:focus-within{border-color:var(--bulb)}
.nick label{color:var(--muted);font-size:15px}
.nick input{width:15ch;padding:8px 6px;font:700 18px var(--mono);color:var(--paper);background:transparent;border:0;outline:0}
.hint{min-height:1.5em;margin:8px 0 0;font-size:14px;color:var(--faint)}
.hint.bad{color:var(--bad)}

.rings{display:grid;gap:clamp(30px,4vw,46px);margin-top:clamp(40px,6vw,72px)}
.ring{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;align-items:start}
.ring h2{margin:0;padding-top:46px;font:400 15px/1.3 var(--mono);color:var(--muted)}
.ring h2::before{content:"";display:inline-block;width:.75em;height:.75em;margin-right:.55em;border:2px solid currentColor;border-radius:50%;vertical-align:-.04em}
.ring-rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px 14px}
.room{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 6px 12px;border-radius:20px;text-align:center;text-decoration:none}
.room-text{display:flex;flex-direction:column;align-items:center;gap:4px}
.room .emblem{width:108px;height:108px;flex:none}
.room-name{font:400 22px/1.15 var(--display);color:var(--paper);transition:color .2s}
.room-topic{max-width:22ch;font-size:14px;line-height:1.4;color:var(--muted)}
.room-meta{font-size:13px;color:var(--bulb)}
.room-meta:empty{display:none}
.room:not(.closed):hover .room-name,.room:not(.closed):focus-visible .room-name{color:var(--bulb)}
.room.closed .emblem{opacity:.5;filter:grayscale(.55)}
.room.closed .room-name{color:var(--faint)}
.room.closed .room-meta{color:var(--faint)}

.emblem{display:block;overflow:visible}
.emblem .ring-off{fill:none;stroke:var(--bulb-off);stroke-width:3.4;stroke-linecap:round}
.emblem .ring-on{fill:none;stroke:var(--bulb);stroke-width:3.8;stroke-linecap:round;opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .25s}
.room.live .ring-on{opacity:1}
.room:not(.closed):hover .ring-on,.room:not(.closed):focus-visible .ring-on{opacity:1;animation:chase .9s steps(3) infinite}
@keyframes chase{to{transform:rotate(45deg)}}

.house{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;margin-top:clamp(52px,8vw,88px);padding-top:26px;border-top:1px dashed var(--line);font-size:15px;color:var(--muted)}
.house h2{margin:0;font:inherit;color:var(--paper)}
.house p{max-width:62ch;margin:0 0 10px}
.house .preview{color:var(--faint)}

/* ---------- room ---------- */
.room-view{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh);display:grid;grid-template-columns:220px minmax(0,1fr) 210px;background:var(--night)}
.chanlist,.nicklist{min-height:0;overflow-y:auto;padding:16px 12px;background:var(--night-2)}
.chanlist{border-right:1px solid var(--line)}
.nicklist{border-left:1px solid var(--line)}
.home{display:flex;align-items:center;gap:9px;padding:4px 8px 10px;font:400 22px var(--display);text-decoration:none}
.home svg{width:30px;height:30px;flex:none}
.chanlist h3,.nicklist h3{margin:18px 8px 6px;font:400 13px var(--mono);color:var(--faint)}
.chan{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:10px;color:var(--muted);text-decoration:none}
.chan i{width:9px;height:9px;flex:none;border-radius:50%;background:var(--c)}
.chan:hover{color:var(--paper)}
.chan[aria-current="page"]{color:var(--paper);background:var(--night-3)}
.chan .n{margin-left:auto;font-size:13px;color:var(--faint)}
.nicklist ul{margin:0;padding:0;list-style:none}
.nicklist li{padding:3px 8px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nicklist .op{color:var(--notice)}

.chat{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0}
.chat-head{display:flex;align-items:center;gap:12px;min-width:0;padding:12px 18px;border-bottom:1px solid var(--line)}
.back{display:none;align-items:center;justify-content:center;width:38px;height:38px;flex:none;margin-left:-8px;border-radius:50%;font-size:28px;line-height:1;text-decoration:none}
.chat-emblem .emblem{width:44px;height:44px}
.chat-title{min-width:0;flex:1}
.chat-title h2{margin:0;font:400 24px/1.1 var(--display)}
.chat-title p{margin:3px 0 0;overflow:hidden;font-size:14px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.chat-here{flex:none;font-size:14px;color:var(--bulb)}
.chat-here .s{display:none}

.log{overflow-y:auto;overscroll-behavior:contain;padding:14px 18px 20px;font-size:16px;line-height:1.5}
.line{position:relative;display:grid;grid-template-columns:6ch 13ch minmax(0,1fr);column-gap:1ch;padding:1px 4px;border-radius:4px}
.line time{color:var(--faint)}
.line .who{overflow:hidden;font-weight:700;text-align:right;white-space:nowrap;text-overflow:ellipsis}
.line .what{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .who::before{content:"<";color:var(--faint)}
.msg .who::after{content:">";color:var(--faint)}
.sys .who,.sys .what{color:var(--join)}
.notice .who{color:var(--notice)}
.notice .what{color:var(--muted)}
.act .who,.act .what{color:var(--action)}
.act .what{font-style:italic}
.line.mention{background:linear-gradient(90deg,rgba(255,212,71,.12),transparent 75%);box-shadow:inset 2px 0 var(--yellow)}
.line.day{display:block;margin:12px 0;text-align:center;font-size:14px;color:var(--faint)}

.composer{display:flex;align-items:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom)) 18px;border-top:1px solid var(--line);background:var(--night-2)}
.prompt{flex:none;font-weight:700;white-space:nowrap}
.prompt::before{content:"[";color:var(--faint)}
.prompt::after{content:"]";color:var(--faint)}
.composer input{flex:1;min-width:0;padding:10px 4px;font:400 16px var(--mono);color:var(--paper);background:transparent;border:0;outline:0}
.composer input::placeholder{color:var(--faint)}
.composer button{flex:none;padding:9px 18px;font-weight:700;color:var(--night);background:var(--bulb);border:0;border-radius:999px;cursor:pointer}

/* ---------- live rooms: new room, reports, rude text, dialogs ---------- */
button.room{border:0;background:none;font:inherit;color:inherit;cursor:pointer}
.new-room .room-name{color:var(--muted)}
.rep{position:absolute;right:4px;top:1px;width:28px;height:24px;padding:0;border:0;border-radius:6px;background:none;color:var(--faint);font-size:14px;text-indent:0;cursor:pointer;opacity:0}
.line:hover .rep,.rep:focus-visible{opacity:1}
.rep:hover{color:var(--red)}
.line.has-rep{padding-right:34px}
.rude .what{filter:blur(5px);cursor:pointer;transition:filter .2s}
.rude.shown .what{filter:none}
.composer input:disabled{opacity:.6}
.composer button:disabled{opacity:.4;cursor:default}
dialog{width:min(440px,calc(100vw - 28px));padding:24px;border:1px solid var(--line);border-radius:22px;background:var(--night-2);color:var(--paper);box-shadow:0 40px 90px -30px #000}
dialog::backdrop{background:rgba(9,7,13,.74);backdrop-filter:blur(5px)}
dialog h2{margin:0 0 10px;font:700 20px/1.3 var(--mono)}
dialog p{margin:0 0 12px;color:var(--muted)}
dialog .rule{font-size:15px;color:var(--faint)}
.field{display:flex;flex-direction:column;gap:6px;margin:16px 0 0;font-size:15px;color:var(--muted)}
.field input{width:100%;min-width:0;padding:11px 12px;font:400 17px var(--mono);color:var(--paper);background:var(--night);border:1px solid var(--line);border-radius:12px;outline:0}
.field input:focus{border-color:var(--bulb)}
.field small{color:var(--faint);font-size:13px}
.hash-input{display:flex;align-items:center;gap:6px;padding-left:12px;background:var(--night);border:1px solid var(--line);border-radius:12px}
.hash-input:focus-within{border-color:var(--bulb)}
.hash-input b{font:400 20px var(--display);color:var(--bulb)}
.hash-input input{border:0;background:none;padding-left:0}
.err{min-height:1.4em;margin:12px 0 0!important;color:var(--bad)!important;font-size:15px}
.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin-top:18px}
.btn{padding:10px 18px;font-weight:700;color:var(--paper);background:none;border:1px solid var(--line);border-radius:999px;cursor:pointer}
.btn.primary{color:var(--night);background:var(--bulb);border-color:var(--bulb)}
.btn.danger{color:#fff;background:#C8352B;border-color:#C8352B}
.btn:disabled{opacity:.5;cursor:default}
@media (hover:none){.rep{opacity:.55}}

/* ---------- small screens ---------- */
@media (max-width:1100px){.room-view{grid-template-columns:200px minmax(0,1fr)}.nicklist{display:none}}
@media (max-width:720px){
  .room-view{grid-template-columns:minmax(0,1fr)}
  .chanlist,.prompt{display:none}
  .back{display:inline-flex}
  .chat-head{padding:10px 14px}
  .chat-here .l{display:none}
  .chat-here .s{display:inline}
  .log{padding:12px 14px 18px}
  .line{display:block;padding-left:2ch;text-indent:-2ch}
  .line time{margin-right:1ch}
  .line .who{display:inline;margin-right:1ch}
  .composer{padding-left:14px}
}
@media (max-width:640px){
  .ring,.house{grid-template-columns:minmax(0,1fr);gap:8px}
  .ring h2{padding-top:0}
  .ring-rooms{grid-template-columns:minmax(0,1fr);gap:2px}
  .room{flex-direction:row;gap:14px;padding:8px 4px;text-align:left}
  .room-text{align-items:flex-start;gap:2px}
  .room .emblem{width:66px;height:66px}
  .room-name{font-size:20px}
  .room-topic{max-width:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
</svg>

<main id="lobby" class="lobby">
  <div class="lang" role="group" aria-label="Language / Език">
    <button type="button" data-lang="bg">BG</button><button type="button" data-lang="en">EN</button>
  </div>
  <header class="hero">
    <div class="sign" id="sign">
      <svg class="bulbs" aria-hidden="true" focusable="false"><rect class="on" filter="url(#glow)"/><rect class="off"/></svg>
      <h1 class="logo"><span class="sr-only">cIRCo.chat</span><span aria-hidden="true"><span class="lr" style="--i:0">c</span><span class="ly" style="--i:1">I</span><span class="ly" style="--i:2">R</span><span class="ly" style="--i:3">C</span><span class="lr" style="--i:4">o</span></span></h1>
      <p class="tagline" data-t="tagline"></p>
    </div>
    <p class="intro" data-t="intro"></p>
    <div class="nick">
      <label for="nickInput" data-t="nickLabel"></label>
      <input id="nickInput" maxlength="16" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-describedby="nickHint">
    </div>
    <p class="hint" id="nickHint" aria-live="polite"></p>
  </header>
  <div class="rings" id="rings"></div>
  <footer class="house">
    <h2 data-t="rulesTitle"></h2>
    <div><p data-t="rules"></p><p class="preview" id="modeNote"></p></div>
  </footer>
</main>

<section id="room" class="room-view" hidden>
  <aside class="chanlist">
    <a class="home" href="#" data-t-aria="back"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#251D33"/><path d="M37.9 24.1A14 14 0 1 0 37.9 43.9" fill="none" stroke="#F0483E" stroke-width="7" stroke-linecap="round"/><circle cx="45" cy="19" r="4.5" fill="none" stroke="#FFD447" stroke-width="3.5"/></svg>cIRCo</a>
    <nav id="chanlist" data-t-aria="roomsNav"></nav>
  </aside>
  <div class="chat">
    <header class="chat-head">
      <a class="back" href="#" data-t-aria="back">‹</a>
      <span class="chat-emblem" id="chatEmblem"></span>
      <div class="chat-title"><h2 id="chatName"></h2><p id="chatTopic"></p></div>
      <span class="chat-here" id="chatHere"></span>
    </header>
    <div class="log" id="log" role="log" aria-live="polite" tabindex="0"></div>
    <form class="composer" id="composer" autocomplete="off">
      <label class="prompt" id="prompt" for="msgInput"></label>
      <input id="msgInput" maxlength="400" autocomplete="off" enterkeyhint="send">
      <button type="submit" data-t="send"></button>
    </form>
  </div>
  <aside class="nicklist"><h3 id="peopleHead"></h3><ul id="people"></ul></aside>
</section>
<dialog id="ask" aria-labelledby="askTitle">
  <h2 id="askTitle"></h2><p id="askBody"></p><p class="rule" id="askRule"></p>
  <div class="actions"><button type="button" class="btn" id="askNo"></button><button type="button" class="btn danger" id="askYes"></button></div>
</dialog>
<dialog id="newRoom" aria-labelledby="newRoomTitle">
  <form id="newRoomForm" novalidate>
    <h2 id="newRoomTitle" data-t="newRoomTitle"></h2>
    <p data-t="newRoomIntro"></p>
    <label class="field"><span data-t="roomName"></span><span class="hash-input"><b>#</b><input id="roomName" maxlength="20" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></span><small data-t="roomNameHint"></small></label>
    <label class="field"><span data-t="roomTopic"></span><input id="roomTopic" maxlength="80" autocomplete="off" data-t-ph="roomTopicPh"></label>
    <p class="err" id="newRoomErr" aria-live="polite"></p>
    <div class="actions"><button type="button" class="btn" id="newRoomCancel" data-t="cancel"></button><button type="submit" class="btn primary" id="newRoomOk" data-t="create"></button></div>
  </form>
</dialog>
<noscript><p style="padding:24px">cIRCo.chat needs JavaScript to open the rooms.</p></noscript>

<script>
(() => {
"use strict";

const CONFIG = { historyHours: 24, maxPerRoom: 300, maxLen: 400, minGapMs: 600, pollMs: 20000 };
const QS = new URLSearchParams(location.search);
const SERVER = (QS.get("server") || "https://circo.mihov-emil.workers.dev").replace(/\/+$/, "");
const RESERVED = ["circo", "admin", "administrator", "mod", "moderator", "op", "root", "system", "server", "nickserv", "chanserv", "guest"];

/* ---------- words ---------- */
const TEXT = {
  en: {
    tagline: "Every room is a different show.",
    intro: "Pick a nickname, choose a room and join the conversation.",
    nickLabel: "Nickname",
    nickHint: "Latin letters, digits, _ or -",

    nickReserved: "That nickname is reserved.",
    nickTaken: "Someone here already uses that nickname.",

    soon: "Opens soon",
    hereShort: n => `${n} here`,
    hereLong: n => n === 1 ? "1 person here now" : `${n} people here now`,
    peopleHead: "Here now",
    roomsNav: "Rooms",
    rulesTitle: "House rules",
    rules: "Be kind and don't spam. Don't pretend to be someone else. Every message disappears after 24 hours.",
    preview: "This is a preview: messages stay on this device until the live rooms open.",
    liveRules: (s, r) => `Rude words: you're asked before the message goes out. ${s} strikes within an hour, or reports from ${r} different people, mean an automatic ban: 1 hour, then 24 hours, then 7 days.`,
    back: "All rooms",
    send: "Send",
    placeholder: r => `Message ${r}`,
    nowTalking: r => `Now talking in ${r}`,
    topicIs: tp => `Topic: ${tp}`,
    welcome: n => `Hi ${n}. Type /help to see the commands.`,
    previewNotice: "Preview: messages stay on this device for 24 hours.",
    joined: (n, r) => `${n} has joined ${r}`,
    left: (n, r) => `${n} has left ${r}`,
    nickChanged: (a, b) => `${a} is now known as ${b}`,
    nickInUse: (a, b) => `${a} is taken here, so you're ${b} for now.`,
    dayChanged: d => `Day changed to ${d}`,
    help: ["/nick name    change your nickname", "/me text      describe what you're doing", "/join #room   go to another room", "/part         leave this room", "/report nick  report their last message", "/topic        show the topic", "/clear        clear your screen"],
    unknownCmd: c => `Unknown command ${c}. Type /help.`,
    slowDown: "Slow down a little.",
    noSuchRoom: r => `There's no room called ${r}.`,
    roomClosed: r => `${r} opens soon.`,
    ringPeople: "Rooms by people",
    newRoom: "New room",
    newRoomHint: "Open your own",
    newRoomTitle: "Open a new room",
    newRoomIntro: "It closes on its own after 24 quiet hours.",
    roomName: "Name",
    roomNameHint: "3 to 20 small Latin letters, digits or dashes",
    roomTopic: "Topic",
    roomTopicPh: "What is this room about?",
    create: "Open the room",
    cancel: "Cancel",

/* ---------- preview transport: history in localStorage, events between tabs of this browser ---------- */
const Local = (() => {
  const tab = uid();
  const bc = "BroadcastChannel" in window ? new BroadcastChannel("circo-v1") : null;
  const peers = new Map(), subs = new Set(), TTL = 90e3;
  let me = { nick: "", room: "" };
  const cut = list => { const since = Date.now() - CONFIG.historyHours * 3600e3; return (Array.isArray(list) ? list : []).filter(m => m && m.t > since).slice(-CONFIG.maxPerRoom); };
  const emit = ev => subs.forEach(fn => fn(ev));
  const post = ev => { try { if (bc) bc.postMessage({ ...ev, tab }); } catch {} };
  const prune = () => { const since = Date.now() - TTL; let gone = false; for (const [k, p] of peers) if (p.t < since) { peers.delete(k); gone = true; } return gone; };
  if (bc) bc.onmessage = ({ data: ev }) => {
    if (!ev || ev.tab === tab) return;
    if (ev.type === "here") { peers.set(ev.tab, { nick: ev.nick, room: ev.room, t: Date.now() }); if (ev.ask) post({ type: "here", ...me }); emit({ type: "presence" }); }
    else if (ev.type === "bye") { peers.delete(ev.tab); emit({ type: "presence" }); }
    else emit(ev);
  };
  const api = {
    history: room => cut(store.get(KEY.log(room), [])),
    send(room, msg) { const list = cut(store.get(KEY.log(room), [])); list.push(msg); store.set(KEY.log(room), list); post({ type: "msg", room, msg }); },
    announce: post,
    presence(nick, room, ask) { me = { nick, room }; post({ type: "here", nick, room, ask: !!ask }); },
    people(room) { prune(); const s = new Set(); for (const p of peers.values()) if (p.room === room) s.add(p.nick); if (room && me.room === room) s.add(me.nick); return [...s]; },
    count: room => api.people(room).length,
    taken(n) { prune(); n = n.toLowerCase(); for (const p of peers.values()) if (p.nick.toLowerCase() === n) return true; return false; },
    on: fn => subs.add(fn),
    start(nick) { api.presence(nick, "", true); setInterval(() => { post({ type: "here", ...me }); if (prune()) emit({ type: "presence" }); }, 25e3); },
    stop() { post({ type: "bye" }); }
  };
  return api;
})();

/* ---------- live transport: one WebSocket to the room you're in ---------- */
const Net = {
  ws: null, room: null, want: false, tries: 0, timer: 0, ping: 0, nickTries: 0,
  open(room) {
    this.close();
    this.room = room;
    this.want = true;
    const url = SERVER.replace(/^http/, "ws") + `/api/room/${encodeURIComponent(room)}/ws?nick=${encodeURIComponent(nick)}&device=${encodeURIComponent(DEVICE)}`;
    let ws;
    try { ws = new WebSocket(url); } catch { return this.retry(); }
    this.ws = ws;
    ws.onopen = () => { this.tries = 0; clearInterval(this.ping); this.ping = setInterval(() => { try { ws.send("ping"); } catch {} }, 30000); };
    ws.onmessage = e => { if (e.data === "pong") return; let m; try { m = JSON.parse(e.data); } catch { return; } onServer(m); };
    ws.onclose = () => { if (this.ws !== ws) return; this.ws = null; clearInterval(this.ping); if (this.want) this.retry(); };
  },
  retry() {
    if (!this.want) return;
    const wait = [1000, 2000, 5000, 10000, 20000][Math.min(this.tries++, 4)];
    if (this.tries === 1) sys(t("reconnecting"));
    clearTimeout(this.timer);
    this.timer = setTimeout(() => { if (this.want && current === this.room) this.open(this.room); }, wait);
  },
  close() {
    this.want = false;
    clearTimeout(this.timer);
    clearInterval(this.ping);
    if (this.ws) { const w = this.ws; this.ws = null; try { w.close(1000); } catch {} }
  },
  send(obj) {
    if (this.ws && this.ws.readyState === 1) { this.ws.send(JSON.stringify(obj)); return true; }
    notice(t("notConnected"));
    return false;
  }
};

/* ---------- nickname ---------- */
const NICK_RE = /^[A-Za-z][A-Za-z0-9_-]{1,15}$/;
let nick = store.get(KEY.nick, "");
if (!NICK_RE.test(nick || "")) { nick = "Guest" + (1000 + Math.floor(Math.random() * 9000)); store.set(KEY.nick, nick); }
const nickError = v => {
  if (!NICK_RE.test(v)) return t("nickBad");
  if (RESERVED.includes(v.toLowerCase()) && v.toLowerCase() !== nick.toLowerCase()) return t("nickReserved");
  if (!live && v.toLowerCase() !== nick.toLowerCase() && Local.taken(v)) return t("nickTaken");
  return "";
};
function useNick(v) {
  nick = v;
  store.set(KEY.nick, nick);
  if (nickInput.value !== nick) nickInput.value = nick;
  paintPrompt();
}
function setNick(v, fromChat) {
  v = (v || "").trim();
  if (v === nick) return true;
  const err = nickError(v);
  if (err) { if (fromChat) notice(err); return false; }
  if (live && current) {
    // the room decides; the change lands when it answers with a "nick" event
    if (Net.ws && Net.ws.readyState === 1) Net.send({ type: "nick", nick: v });
    else { useNick(v); Net.open(current); }
    return true;
  }
  const old = nick;
  useNick(v);
  if (current) { sys(t("nickChanged", old, nick)); Local.announce({ type: "nick", room: current, old, nick }); }
  Local.presence(nick, current || "");
  updatePeople();
  return true;
}

/* ---------- lobby ---------- */
const nickInput = $("#nickInput"), hint = $("#nickHint");
const showHint = err => { hint.textContent = err || t("nickHint"); hint.classList.toggle("bad", !!err); };
nickInput.addEventListener("input", () => {

nickInput.addEventListener("blur", () => { if (nickInput.value.trim() !== nick) { nickInput.value = nick; showHint(""); } });

const countOf = id => live ? (roomById(id)?.people || 0) : Local.count(id);
function card(r) {

  return r.open ? `<a class="room" href="#${esc(r.id)}" data-room="${esc(r.id)}">${inner}</a>` : `<div class="room closed">${inner}</div>`;
}
function renderRings() {

/* the server's room list: official rooms keep their emblems, people's rooms get a lettered badge */
function mergeServer(list) {
  rooms = list.map(s => {
    const o = OFFICIAL[s.id];
    return o ? { ...o, open: !!s.open, people: s.people || 0 } : { id: s.id, ring: "people", open: true, dot: s.color, color: s.color, topic: s.topic || "", people: s.people || 0 };
  });
}
async function refreshRooms(first) {
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), first ? 4000 : 8000);
    const res = await fetch(SERVER + "/api/rooms", { signal: ctl.signal, cache: "no-store" });
    clearTimeout(timer);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (!Array.isArray(data.rooms)) throw new Error("shape");
    if (data.rules) rules = data.rules;
    live = true;
    mergeServer(data.rooms);
  } catch {
    if (first) live = false;
  }
  document.body.classList.toggle("is-live", live);
  setModeTexts();
  renderRings();
  return live;
}

/* the marquee: bulbs follow the sign's edge; every third one goes dark and the gap runs clockwise */
const sign = $("#sign"), bulbs = $(".bulbs", sign), bulbOn = $(".on", bulbs), bulbOff = $(".off", bulbs);
let chase = null;
function layoutSign() {
  if ($("#lobby").hidden) return;
  const w = sign.clientWidth, h = sign.clientHeight;
  if (!w || !h) return;
  const inset = 13, rx = 11, W = w - 2 * inset, H = h - 2 * inset;
  const per = 2 * (W + H) - 8 * rx + 2 * Math.PI * rx;
  const n = Math.max(12, Math.round(per / 21 / 3) * 3), sp = per / n;
  bulbs.setAttribute("viewBox", `0 0 ${w} ${h}`);
  for (const r of [bulbOn, bulbOff]) { r.setAttribute("x", inset); r.setAttribute("y", inset); r.setAttribute("width", W); r.setAttribute("height", H); r.setAttribute("rx", rx); }
  bulbOn.setAttribute("stroke-dasharray", `0 ${sp}`);
  bulbOff.setAttribute("stroke-dasharray", `0 ${3 * sp}`);
  if (chase) chase.cancel();
  chase = null;
  if (!reduceMotion.matches && bulbOff.animate) {
    chase = bulbOff.animate([{ strokeDashoffset: "0px" }, { strokeDashoffset: `${-3 * sp}px` }],
      { duration: 1500, iterations: Infinity, easing: "steps(3)", delay: Math.max(0, 1300 - performance.now()) });
  }
}

/* ---------- asking before something happens ---------- */
const askDlg = $("#ask");

/* ---------- room ---------- */
let current = null, lastDay = null, lastSent = 0, livePeople = [];
const log = $("#log"), msgInput = $("#msgInput"), sendBtn = $("#composer button");
const sent = []; let sentPos = 0;

function renderChanlist() {
  $("#chanlist").innerHTML = RINGS.filter(g => live || !g.live).map(g => {
    const list = rooms.filter(r => r.ring === g.id && r.open);
    if (!list.length) return "";

      const n = countOf(r.id);
      return `<a class="chan" href="#${esc(r.id)}" style="--c:${esc(r.dot || "#8B6CF0")}"${r.id === current ? ' aria-current="page"' : ""}><i></i>#${esc(r.id)}${n ? `<span class="n">${n}</span>` : ""}</a>`;
    }).join("");

}
function updatePeople() {
  if (!current) return;
  const people = (live ? livePeople : Local.people(current)).slice().sort((a, b) => a.localeCompare(b));
  $("#chatHere").innerHTML = `<span class="l">${esc(t("hereLong", people.length))}</span><span class="s">${esc(t("hereShort", people.length))}</span>`;

  $("#people").innerHTML = `<li class="op">@cIRCo</li>` + people.map(p => `<li style="color:${nickColor(p)}">${esc(p)}</li>`).join("");
}
function paintPrompt() {
  const p = $("#prompt");
  p.textContent = nick;
  p.style.color = nickColor(nick);
}
function setComposer(on, placeholder) {
  msgInput.disabled = !on;
  sendBtn.disabled = !on;
  msgInput.placeholder = placeholder || t("placeholder", "#" + current);
}

const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 80;
function push(el, ts, force) {
  const stick = force || nearBottom();
  const k = dayKey(ts);
  if (lastDay && k !== lastDay) {
    const d = document.createElement("div");
    d.className = "line day";
    d.textContent = t("dayChanged", new Date(ts).toLocaleDateString(lang === "bg" ? "bg-BG" : "en-GB", { weekday: "long", day: "numeric", month: "long" }));
    log.append(d);
  }
  lastDay = k;
  log.append(el);
  if (stick) log.scrollTop = log.scrollHeight;
}
function line(cls, ts, who, color, text) {
  const el = document.createElement("div");
  el.className = "line " + cls;
  const tm = document.createElement("time");
  tm.dateTime = new Date(ts).toISOString();
  tm.textContent = hhmm(ts);
  const w = document.createElement("span");
  w.className = "who";
  w.textContent = who;
  if (color) w.style.color = color;
  const x = document.createElement("span");
  x.className = "what";
  x.textContent = text;
  el.append(tm, w, x);
  return el;
}
const sys = text => { const ts = Date.now(); push(line("sys", ts, "***", null, text), ts); };
const notice = text => { const ts = Date.now(); push(line("notice", ts, "-cIRCo-", null, text), ts); };
const mentions = text => new RegExp(`(?:^|[^\\w-])${nick}(?![\\w-])`, "i").test(text);
function addMsg(m, mine) {
  if (!m || typeof m.text !== "string" || typeof m.nick !== "string" || typeof m.t !== "number") return;
  if (mine == null) mine = m.nick === nick;
  const el = m.kind === "act" ? line("act", m.t, "*", null, `${m.nick} ${m.text}`) : line("msg", m.t, m.nick, nickColor(m.nick), m.text);
  if (m.id) { el.dataset.id = m.id; el.dataset.nick = m.nick; }
  if (!mine && mentions(m.text)) el.classList.add("mention");
  if (m.rude && !mine) { el.classList.add("rude"); $(".what", el).title = t("rudeHidden"); }
  if (live && m.id && !mine) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "rep";
    b.textContent = "⚑";
    b.title = t("report");
    b.setAttribute("aria-label", `${t("report")} ${m.nick}`);
    el.classList.add("has-rep");
    el.append(b);
  }
  push(el, m.t, mine);
}
log.addEventListener("click", e => {
  const rep = e.target.closest(".rep");
  if (rep) { const l = rep.closest(".line"); return report(l.dataset.id, l.dataset.nick); }
  const rude = e.target.closest(".rude");
  if (rude) rude.classList.toggle("shown");
});
function say(kind, text) {
  const msg = { id: uid(), t: Date.now(), nick, kind, text: text.slice(0, CONFIG.maxLen) };
  Local.send(current, msg);
  addMsg(msg, true);
}

/* everything the server can tell the room */
function onServer(m) {
  switch (m.type) {
    case "hello":
      Net.nickTries = 0;
      rules = m.rules || rules;
      log.innerHTML = "";
      lastDay = null;
      (m.history || []).forEach(x => addMsg(x));
      sys(t("nowTalking", "#" + current));
      sys(t("topicIs", topicOf(roomById(current))));
      notice(t("welcome", nick));
      livePeople = m.people || [];
      updatePeople();
      setComposer(true);
      log.scrollTop = log.scrollHeight;
      break;
    case "msg": addMsg(m.msg); break;
    case "join": sys(t("joined", m.nick, "#" + current)); break;
    case "part": sys(t("left", m.nick, "#" + current)); break;
    case "nick":
      if (m.old === nick) useNick(m.nick);
      sys(t("nickChanged", m.old, m.nick));
      break;
    case "people": {
      livePeople = m.people || [];
      const r = roomById(current);
      if (r) r.people = livePeople.length;
      updatePeople();
      renderChanlist();
      break;
    }
    case "confirm": askRude(m); break;
    case "strike": notice(t("strikeInfo", m.strikes, m.limit)); break;
    case "blocked":
      notice(t("blocked", (m.words || []).map(w => t("quote", w)).join(", ")));
      notice(t("strikeInfo", m.strikes, m.limit));
      break;
    case "banned":
      Net.want = false;
      notice(t("banned", until(m.until), t("why")[m.reason] || ""));
      setComposer(false, t("bannedShort", until(m.until)));
      break;
    case "expelled":
      (m.ids || []).forEach(id => { const el = log.querySelector(`[data-id="${CSS.escape(id)}"]`); if (el) el.remove(); });
      if (m.nick !== nick) sys(t("wasBanned", m.nick));
      break;
    case "reported": notice(t("reported", m.nick)); break;
    case "refused":
      Net.want = false;
      if (m.code === "nick_taken" && Net.nickTries < 3) {
        Net.nickTries++;
        const alt = nick.length < 16 ? nick + "_" : nick.slice(0, 15) + Math.floor(Math.random() * 10);
        notice(t("nickInUse", nick, alt));
        nick = alt;
        paintPrompt();
        setTimeout(() => { if (current) Net.open(current); }, 250);
      } else if (m.code === "banned") {
        notice(t("banned", until(m.until), t("why")[m.reason] || ""));
        setComposer(false, t("bannedShort", until(m.until)));
      } else {
        notice(m.code === "rude_nick" ? t("rudeNick") : m.code === "nick_taken" ? t("nickTaken") : t("nickBad"));
      }
      break;
    case "error":
      notice({ slow: t("slowDown"), nick_taken: t("nickTaken"), bad_nick: t("nickBad"), rude_nick: t("rudeNick"), self_report: t("selfReport") }[m.code] || "");
      break;
  }
}

function enterRoom(id) {
  const r = roomById(id);
  if (!r || current === id) return;
  leaveRoom();
  current = id;
  $("#lobby").hidden = true;
  $("#room").hidden = false;
  $("#chatEmblem").innerHTML = emblem(r);
  $("#chatName").textContent = "#" + id;
  $("#chatTopic").textContent = topicOf(r);
  document.title = `#${id} · cIRCo.chat`;
  log.innerHTML = "";
  lastDay = null;
  livePeople = [];
  setComposer(true);
  if (live) {
    Net.open(id);
  } else {
    Local.history(id).forEach(m => addMsg(m));
    sys(t("nowTalking", "#" + id));
    sys(t("topicIs", topicOf(r)));
    notice(t("welcome", nick));
    notice(t("previewNotice"));
    log.scrollTop = log.scrollHeight;
    Local.presence(nick, id);
    Local.announce({ type: "join", room: id, nick });
  }
  paintPrompt(); renderChanlist(); updatePeople();
  if (matchMedia("(hover: hover) and (pointer: fine)").matches) msgInput.focus();
}
function leaveRoom() {
  if (!current) return;
  if (live) Net.close();
  else Local.announce({ type: "part", room: current, nick });
}
function showLobby() {
  leaveRoom();
  if (current && !live) Local.presence(nick, "");
  current = null;
  $("#room").hidden = true;
  $("#lobby").hidden = false;
  document.title = "cIRCo.chat";
  if (live) refreshRooms(); else updateCounts();
  requestAnimationFrame(layoutSign);
}
function route() {
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, "")).toLowerCase();
  const r = roomById(id);
  if (r && r.open) return enterRoom(id);
  if (location.href.includes("#")) history.replaceState(null, "", location.pathname + location.search);
  showLobby();
}

function command(raw) {
  const [cmd, ...rest] = raw.slice(1).split(/\s+/);
  const arg = rest.join(" ").trim();
  switch ((cmd || "").toLowerCase()) {
    case "help": t("help").forEach(notice); break;
    case "me": if (arg) live ? Net.send({ type: "msg", kind: "act", text: arg }) : say("act", arg); break;
    case "nick": setNick(arg, true); break;
    case "join": case "j": {
      const id = arg.replace(/^#/, "").toLowerCase(), r = roomById(id);
      if (!r) notice(t("noSuchRoom", "#" + id));
      else if (!r.open) notice(t("roomClosed", "#" + id));
      else location.hash = id;
      break;
    }
    case "part": case "leave": location.hash = ""; break;
    case "report": {
      if (!live) return notice(t("reportPreview"));
      const who = arg.replace(/^@/, "").toLowerCase();
      const lines = $$("#log .line[data-id]").filter(l => l.dataset.nick.toLowerCase() === who && l.dataset.nick !== nick);
      if (!lines.length) return notice(t("noMsgFrom", arg));
      const l = lines[lines.length - 1];
      report(l.dataset.id, l.dataset.nick);
      break;
    }
    case "topic": sys(t("topicIs", topicOf(roomById(current)))); break;
    case "clear": log.innerHTML = ""; lastDay = null; break;
    default: notice(t("unknownCmd", "/" + cmd));
  }
}
$("#composer").addEventListener("submit", e => {
  e.preventDefault();
  const v = msgInput.value.trim();
  if (!v || !current || msgInput.disabled) return;
  const isCmd = v.startsWith("/") && !v.startsWith("//");
  if (!isCmd && Date.now() - lastSent < CONFIG.minGapMs) return notice(t("slowDown"));
  msgInput.value = "";
  sent.push(v); sentPos = sent.length;
  if (isCmd) return command(v);
  lastSent = Date.now();
  const text = v.startsWith("//") ? v.slice(1) : v;
  if (live) { if (!Net.send({ type: "msg", kind: "msg", text })) msgInput.value = v; }
  else say("msg", text);
});
msgInput.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" && sentPos > 0 && (!msgInput.value || msgInput.value === sent[sentPos])) { e.preventDefault(); msgInput.value = sent[--sentPos]; }
  else if (e.key === "ArrowDown" && sentPos < sent.length) { e.preventDefault(); msgInput.value = sent[++sentPos] || ""; }
  else if (e.key === "Tab" && !e.shiftKey) {
    /* IRC habit: Tab completes a nickname */
    const pos = msgInput.selectionStart, before = msgInput.value.slice(0, pos);
    const m = /([A-Za-z][\w-]*)$/.exec(before);
    if (!m) return;
    const people = live ? livePeople : Local.people(current);
    const hit = people.find(p => p !== nick && p.toLowerCase().startsWith(m[1].toLowerCase()));
    if (!hit) return;
    e.preventDefault();
    const start = pos - m[1].length, tail = start === 0 ? ": " : " ";
    msgInput.value = before.slice(0, start) + hit + tail + msgInput.value.slice(pos);
    msgInput.setSelectionRange(start + hit.length + tail.length, start + hit.length + tail.length);
  }
});

Local.on(ev => {
  if (live) return;
  if (ev.type === "presence") { updateCounts(); updatePeople(); return; }
  if (!current || ev.room !== current) return;
  if (ev.type === "msg" && ev.msg) addMsg(ev.msg, false);
  else if (ev.type === "join") sys(t("joined", ev.nick, "#" + ev.room));
  else if (ev.type === "part") sys(t("left", ev.nick, "#" + ev.room));
  else if (ev.type === "nick") sys(t("nickChanged", ev.old, ev.nick));
});

$$("[data-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* keep the chat above the phone keyboard */
if (window.visualViewport) {
  const vv = window.visualViewport, root = document.documentElement.style;
  const fit = () => { root.setProperty("--vvh", vv.height + "px"); root.setProperty("--vvt", vv.offsetTop + "px"); };
  vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit); fit();
}

addEventListener("hashchange", route);
addEventListener("pagehide", () => { if (!live && current) Local.announce({ type: "part", room: current, nick }); Local.stop(); });
addEventListener("pageshow", e => { if (e.persisted && !live) Local.presence(nick, current || "", true); });

nickInput.value = nick;
setLang(lang);
Local.start(nick);
if ("ResizeObserver" in window) new ResizeObserver(() => layoutSign()).observe(sign);
if (document.fonts) document.fonts.ready.then(layoutSign);
refreshRooms(true).then(() => {
  route();
  setInterval(() => { if (live && !current && !document.hidden) refreshRooms(); }, CONFIG.pollMs);
});
})();
</script>
</body>
</html>
