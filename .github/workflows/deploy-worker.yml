name: Deploy Worker
# Manual only until the first deploy has passed (REM: a workflow that doesn't work yet doesn't hang on push).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Token present?
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing in emillion-lab/CIRCO (Settings > Secrets and variables > Actions). Needs Workers Scripts:Edit."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rude-word list still works
        run: |
          node --input-type=module -e "
          const { checkText } = await import('./worker/src/words.js');
          const must = { 'путка': 1, 'pi4ka': 1, 'небе и себе си': 0, 'курс по английски': 0, 'faggot': 2 };
          for (const [t, l] of Object.entries(must)) if (checkText(t).level !== l) { console.error('wrong level for', t); process.exit(1); }
          console.log('words ok');"

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 74820d71c551391ce31d309c2fcb091c
          workingDirectory: worker
          command: deploy

      - name: Live check
        run: |
          sleep 5
          curl -fsS https://circo.mihov-emil.workers.dev/health
          echo
          curl -fsS https://circo.mihov-emil.workers.dev/api/rooms | head -c 300
